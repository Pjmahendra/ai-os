# Fly.io app config for apps/api. Change `app` to a globally-unique
# name before your first deploy (see DEPLOY.md).
app = "ai-os-api-CHANGE-ME"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"
  AI_PROVIDER = "openrouter"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep the machine running continuously - the cron scheduler
  # (setInterval-based) depends on the process staying alive, unlike
  # a stateless request handler. Scaling to zero would silently stop
  # scheduled automations from firing.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
